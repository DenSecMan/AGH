[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agh"
version = "0.1.0"
description = "AGH: a file-first AI agent harness for the terminal"
requires-python = ">=3.11"
dependencies = [
  "textual>=8", "rich>=13", "pyyaml>=6", "langchain-core>=1",
  "langchain-openai>=1", "langchain-anthropic>=1", "httpx>=0.27", "jsonschema>=4", "pydantic>=2",
]

[project.optional-dependencies]
mcp = ["langchain-mcp-adapters>=0.2", "mcp>=1.20"]  # only for connectors with `type: mcp`
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3", "langchain-mcp-adapters>=0.2", "mcp>=1.20"]
# Only for model providers beyond the built-in ones; add that provider's own langchain-* package too.
langchain = ["langchain>=1"]

[project.scripts]
agh = "agh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agh = ["starter/**/*", "starter/**/.*", "tui/*.tcss"]

# uv caches builds of a local checkout and by default rebuilds only when pyproject.toml changes, so a
# reinstall after code changes would silently get the old build. Rebuild whenever anything under src/ changes.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.tcss" },
              { file = "src/agh/starter/**/*" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Every test has its own workspace and home, and release tests spend their time in child processes, so the
# suite runs in parallel. For one process (a debugger, -s output): pytest -n 0
addopts = "-n auto"
